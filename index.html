<script>
'use strict';
const $=id=>document.getElementById(id);
const W=96,H=96,SEED=20261126;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1274126177);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){let t=0,a=.5,f=1;for(let i=0;i<4;i++){t+=a*vnoise(x*f,y*f,s+i);a/=2;f*=2}return t/.9375}
const R=mulberry(SEED);
const rnd=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
// tiles
const T={DEEP:0,SHALLOW:1,SAND:2,GRASS:3,FOREST:4,MOUNT:5,DESERT:6,PATH:7,BRIDGE:8,HOUSE:9,RUIN:10,STALL:11,GATE:12,WELL:13};
const BLOCK=new Set([T.DEEP,T.FOREST,T.MOUNT,T.HOUSE,T.STALL,T.GATE,T.WELL]);
const TCOL={0:'#16406b',1:'#2c7fa8',2:'#e3cd8e',3:'#6d9a3c',4:'#4f8030',5:'#7a746c',6:'#d9b46a',7:'#b89b66',8:'#8a6a3a',9:'#7a5a3a',10:'#8d8272',11:'#8a5a2a',12:'#5a4636',13:'#7a746c'};
const tile=new Uint8Array(W*H),deco=new Array(W*H).fill(''),vari=new Float32Array(W*H);
const idx=(x,y)=>y*W+x;
const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const walk=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return inb(x,y)&&!BLOCK.has(tile[idx(x,y)])};
const POI={village:{n:'واحة النخيل',x:48,y:48,r:8},port:{n:'ميناء الملح',x:22,y:60,r:7},fort:{n:'حصن الجبل',x:72,y:20,r:7},ruins:{n:'آثار الفراعنة',x:20,y:22,r:9},cave:{n:'كهف التنين',x:76,y:72,r:8},oasis:{n:'الواحة الخفية',x:48,y:80,r:6}};
function genWorld(){
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const d=Math.hypot(x-48,y-48)/50;
  const e=fbm(x/14,y/14,1)*.75+.42-d*d*1.0;
  const mo=fbm(x/17,y/17,3),mt=fbm(x/9,y/9,7);
  let t;
  if(e<.3)t=T.DEEP;else if(e<.38)t=T.SHALLOW;else if(e<.44)t=T.SAND;
  else if(mt>.66&&e>.5)t=T.MOUNT;
  else if(mo<.43)t=T.DESERT;else if(mo>.57&&hash2(x,y,9)<.55)t=T.FOREST;else t=T.GRASS;
  tile[idx(x,y)]=t;vari[idx(x,y)]=hash2(x,y,5);
  const h=hash2(x,y,11);
  if(t===T.GRASS&&h<.07)deco[idx(x,y)]=h<.035?'🌼':'🌾';
  if(t===T.DESERT&&h<.06)deco[idx(x,y)]=h<.03?'🌵':'🪨';
  if(t===T.SAND&&h<.03)deco[idx(x,y)]='🐚';
  if(t===T.FOREST)deco[idx(x,y)]=h<.5?'🌲':'🌳';
  if(t===T.MOUNT)deco[idx(x,y)]=h<.5?'⛰️':'🏔️';
 }
 for(const k in POI){const p=POI[k];
  for(let y=p.y-p.r;y<=p.y+p.r;y++)for(let x=p.x-p.r;x<=p.x+p.r;x++){if(!inb(x,y)||Math.hypot(x-p.x,y-p.y)>p.r)continue;
   const t=k==='ruins'||k==='cave'?T.DESERT:(k==='fort'?T.GRASS:(k==='oasis'?T.GRASS:T.GRASS));tile[idx(x,y)]=(k==='ruins'||k==='cave')?T.DESERT:T.GRASS;deco[idx(x,y)]='';}}
 const road=(a,b)=>{let x=a.x,y=a.y;const set=()=>{const i=idx(x,y);const t=tile[i];if(t===T.DEEP||t===T.SHALLOW)tile[i]=T.BRIDGE;else if(t!==T.HOUSE&&t!==T.STALL){tile[i]=T.PATH;}deco[i]=''};
  while(x!==b.x){set();x+=Math.sign(b.x-x)}while(y!==b.y){set();y+=Math.sign(b.y-y)}set()};
 const V=POI.village;for(const k of['port','fort','ruins','cave','oasis'])road(V,POI[k]);
 road(POI.port,POI.ruins);road(POI.fort,POI.cave);
 // buildings
 const house=(x,y)=>{for(let dx=0;dx<2;dx++)for(let dy=0;dy<2;dy++){const i=idx(x+dx,y+dy);if(inb(x+dx,y+dy)&&tile[i]!==T.PATH&&tile[i]!==T.BRIDGE){tile[i]=T.HOUSE;deco[i]=(dx===0&&dy===0)?pick(['🏠','🏡','🏘️']):''}}};
 for(const k of['village','port','fort']){const p=POI[k];
  for(const o of[[-5,-4],[3,-5],[-5,3],[4,3],[-2,-6],[1,5]])house(p.x+o[0],p.y+o[1]);
  const i=idx(p.x-1,p.y+1);if(tile[i]!==T.PATH)tile[i]=T.STALL,deco[i]='🏪';
  const w=idx(p.x+1,p.y-1);if(tile[w]!==T.PATH)tile[w]=T.WELL,deco[w]='⛲';
  for(let k2=0;k2<5;k2++){const x=p.x+rnd(-7,7),y=p.y+rnd(-7,7);if(inb(x,y)&&tile[idx(x,y)]===T.GRASS&&!deco[idx(x,y)])deco[idx(x,y)]='🌴',tile[idx(x,y)]=T.FOREST}}
 // ruins
 const rp=POI.ruins;
 for(let a=0;a<14;a++){const x=rp.x+rnd(-8,8),y=rp.y+rnd(-8,8);if(Math.hypot(x-rp.x,y-rp.y)>2.5&&tile[idx(x,y)]===T.DESERT){tile[idx(x,y)]=T.RUIN;deco[idx(x,y)]=pick(['🏛️','🗿','🪦'])}}
 // temple gate (north of ruins center)
 const gx=rp.x,gy=rp.y-3;tile[idx(gx,gy)]=T.GATE;deco[idx(gx,gy)]='🚪';
 for(const dx of[-1,1]){tile[idx(gx+dx,gy)]=T.RUIN;deco[idx(gx+dx,gy)]='🏛️'}
 for(let dx=-1;dx<=1;dx++){const i=idx(gx+dx,gy-1);tile[i]=T.DESERT;deco[i]=''}
 // oasis water
 const op=POI.oasis;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(dx*dx+dy*dy<=4&&!(dx===0&&dy===3)){const i=idx(op.x+dx,op.y+dy-1);tile[i]=T.SHALLOW;deco[i]=''}}
 for(const[dx,dy]of[[-3,-1],[3,-1],[-3,2],[3,2],[0,-4]]){const i=idx(op.x+dx,op.y+dy);if(tile[i]===T.GRASS||tile[i]===T.DESERT){tile[i]=T.FOREST;deco[i]='🌴'}}
 // cave mouth
 const cp=POI.cave;for(let a=0;a<12;a++){const x=cp.x+rnd(-7,7),y=cp.y+rnd(-7,7);if(Math.hypot(x-cp.x,y-cp.y)>2.5&&tile[idx(x,y)]===T.DESERT){tile[idx(x,y)]=T.MOUNT;deco[idx(x,y)]='⛰️'}}
}
function freeNear(x,y,rad=6){for(let r=0;r<=rad;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const X=x+dx,Y=y+dy;if(inb(X,Y)&&tile[idx(X,Y)]!==T.DEEP&&tile[idx(X,Y)]!==T.SHALLOW&&walk(X,Y)&&tile[idx(X,Y)]!==T.PATH&&tile[idx(X,Y)]!==T.BRIDGE)return{x:X+.5,y:Y+.5}}return{x:x+.5,y:y+.5}}
function dirName(fx,fy,tx,ty){const dx=tx-fx,dy=ty-fy;if(Math.hypot(dx,dy)<6)return'قريب من هنا';const a=Math.atan2(dy,dx)*180/Math.PI;const n=['شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب','شمال','شمال شرق'];return n[Math.round((a+360)%360/45)%8]}

 shard:{n:'شظية نجمة الصحراء',e:'✨',t:'q'},key:{n:'مفتاح المعبد',e:'🗝️',t:'q'},letter:{n:'رسالة الشيخ',e:'✉️',t:'q'},
 gem:{n:'جوهرة',e:'💎',t:'m',p:60,d:'للبيع فقط'},scale:{n:'قشرة تنين',e:'🐲',t:'m',p:300,d:'للبيع فقط'}

function nearest(){
 let best=null,bd=1.6;
 for(const n of NPCS){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<bd){bd=d;best={k:'npc',o:n,l:n.n}}}
 for(const c of CHESTS){if(S.opened[c.id])continue;const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;best={k:'chest',o:c,l:'افتح الصندوق'}}}
 for(const k of PICKS){if(S.taken[k.id]||!pickVisible(k))continue;const d=Math.hypot(k.x-P.x,k.y-P.y);if(d<bd){bd=d;best={k:'pick',o:k,l:'التقط '+item(k.item).n}}}

  if(R()<.15){const m={i:-1-CHESTS.indexOf(c),id:pick(['scorpion','wolf','bandit','skeleton']),lvl:Math.max(1,c.tier+1),x:c.x,y:c.y,boss:0};toast('📦 كان فخ! وحش ظهر!');setTimeout(()=>startBattle(m),600);return}
  const g=rnd(8,18)*c.tier,xp=2*c.tier;S.gold+=g;const got=['🪙 '+g];
  if(R()<.5){const id=pick(['p1','p2','m1','p1']);give(id);got.push(item(id).e+' '+item(id).n)}

 else if(n.k==='pick'){const k=n.o;S.taken[k.id]=1;give(k.item);onPick(k.item);beep(900,.15,'triangle');toast('✨ التقطت: '+item(k.item).n);save()}}
function canStand(x,y,r=.28){
 for(const[dx,dy]of[[-r,-r],[r,-r],[-r,r],[r,r]]){const X=Math.floor(x+dx),Y=Math.floor(y+dy);if(!inb(X,Y))return false;const t=tile[idx(X,Y)];
  if(t===T.GATE){if(inv('key')){tile[idx(X,Y)]=T.PATH;deco[idx(X,Y)]='';toast('🗝️ المفتاح فتح باب المعبد!',3000);beep(300,.4,'triangle')}else{if(!canStand.w||performance.now()-canStand.w>2500){toast('🔒 الباب مقفول. محتاج مفتاح المعبد.');canStand.w=performance.now()}return false}}
  else if(BLOCK.has(t))return false}
 return true}
function inSafe(x,y){return['village','port','fort'].some(k=>Math.hypot(x-POI[k].x,y-POI[k].y)<7.5)}
function update(dt){
 if(!S)return;
 const paused=!!MODAL;
 if(!paused){
  S.time+=dt*3;S.play+=dt;
  let mx=joy.x,my=joy.y;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
  if(m>.08){const t=tile[idx(Math.floor(P.x),Math.floor(P.y))];const sp=4.3*(t===T.SHALLOW?.55:1);const nx=P.x+mx*sp*dt,ny=P.y+my*sp*dt;if(canStand(nx,P.y))P.x=nx;if(canStand(P.x,ny))P.y=ny;if(mx!==0)P.face=mx>0?1:-1;P.step+=dt*9;P.moving=1}else P.moving=0;
  // monsters
  const night=darkness()>.5,now=performance.now();
  for(const mo of MONS){if(S.dead[mo.i]!==undefined){if(mo.boss||!(S.time-S.dead[mo.i]>360))continue;delete S.dead[mo.i];mo.x=mo.hx;mo.y=mo.hy}
   const dx=P.x-mo.x,dy=P.y-mo.y,d=Math.hypot(dx,dy);if(d>40)continue;
   const rng=mo.boss===1?3:(night?6:4);let vx=0,vy=0;
   if(d<rng&&!inSafe(mo.x,mo.y)&&!inSafe(P.x,P.y)){const sp=mo.boss===1?.9:(mo.boss===2?2.4:1.7)*(night?1.25:1);vx=dx/d*sp;vy=dy/d*sp}
   else{mo.t-=dt;if(mo.t<=0){mo.t=1+R()*3;const a=R()*6.28,s=R()<.5?0:.7;mo.vx=Math.cos(a)*s;mo.vy=Math.sin(a)*s}vx=mo.vx;vy=mo.vy;if(Math.hypot(mo.x-mo.hx,mo.y-mo.hy)>3.5){vx=(mo.hx-mo.x)*.4;vy=(mo.hy-mo.y)*.4}}
   const nx=mo.x+vx*dt,ny=mo.y+vy*dt;const ok=(x,y)=>{const t=tile[idx(Math.floor(x),Math.floor(y))];return inb(Math.floor(x),Math.floor(y))&&!BLOCK.has(t)&&t!==T.SHALLOW&&!inSafe(x,y)};if(ok(nx,mo.y))mo.x=nx;if(ok(mo.x,ny))mo.y=ny;
   if(d<.8&&now>graceUntil&&!B&&!MODAL&&!inSafe(P.x,P.y)){startBattle(mo);break}}
  // weather
  S.wxT-=dt;if(S.wxT<=0){S.wxT=45+R()*90;const r=Math.random();S.wx=r<.65?'clear':r<.82?'rain':'sand';if(S.wx!=='clear')toast(S.wx==='rain'?'🌧️ بدأ المطر':'🌪️ عاصفة رمل!')}
  // regen slow
  const s=stats();if(!B){S.hp=Math.min(s.maxHp,S.hp+dt*.25*(1+S.lvl*.05));S.mp=Math.min(s.maxMp,S.mp+dt*.3)}
  if((S.autosave=(S.autosave||0)+dt)>10){S.autosave=0;save()}
 }
 hud()}
const darkness=()=>{const h=hourNow();if(h>=18&&h<20)return(h-18)/2;if(h>=20||h<5)return 1;if(h>=5&&h<7)return 1-(h-5)/2;return 0};

function draw(t){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#10223a';ctx.fillRect(0,0,VW,VH);
 if(!S){return}
 const cx=Math.max(VW/TS/2,Math.min(W-VW/TS/2,P.x)),cy=Math.max(VH/TS/2,Math.min(H-VH/TS/2,P.y));
 const ox=VW/2-cx*TS,oy=VH/2-cy*TS;
 const x0=Math.max(0,Math.floor(-ox/TS)),y0=Math.max(0,Math.floor(-oy/TS)),x1=Math.min(W-1,Math.ceil((VW-ox)/TS)),y1=Math.min(H-1,Math.ceil((VH-oy)/TS));
 ctx.textAlign='center';ctx.textBaseline='middle';
 const tm=t/1000;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=idx(x,y),tt=tile[i];let col=TCOL[tt];
  const px=Math.round(ox+x*TS),py=Math.round(oy+y*TS);

  ctx.fillStyle=col;ctx.fillRect(px,py,TS+1,TS+1);
  const v=vari[i];ctx.fillStyle=v<.5?'rgba(0,0,0,'+(.05+v*.08)+')':'rgba(255,255,255,'+((v-.5)*.09)+')';ctx.fillRect(px,py,TS+1,TS+1);
  if(tt===T.DEEP||tt===T.SHALLOW){const w=Math.sin(tm*1.6+x*.8+y*.6)*.5+.5;ctx.fillStyle=`rgba(255,255,255,${.05+w*.1})`;ctx.fillRect(px,py+TS*(.3+w*.3),TS,2)}
  if(tt===T.PATH||tt===T.BRIDGE){ctx.fillStyle='rgba(60,40,20,.12)';ctx.fillRect(px+3,py+3,TS-6,TS-6)}
  if(tt===T.HOUSE){ctx.fillStyle='#8a4a30';ctx.fillRect(px,py,TS+1,TS*.45);ctx.fillStyle='#d8c39a';ctx.fillRect(px,py+TS*.45,TS+1,TS*.55)}
  if(tt===T.STALL){ctx.fillStyle='#b8452a';ctx.fillRect(px,py,TS+1,TS*.4)}
  if(tt===T.GATE){ctx.fillStyle='#3a2a1c';ctx.fillRect(px+4,py,TS-8,TS)}
 }
 ctx.font=Math.floor(TS*.85)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const d=deco[idx(x,y)];if(d){const sc=(tile[idx(x,y)]===T.MOUNT||tile[idx(x,y)]===T.FOREST)?1:.7;ctx.font=Math.floor(TS*.85*sc)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';ctx.fillText(d,ox+x*TS+TS/2,oy+y*TS+TS/2+2)}}
 ctx.font=Math.floor(TS*.8)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
 const spr=[];
 const vis=(e)=>e.x>x0-2&&e.x<x1+2&&e.y>y0-2&&e.y<y1+2;
 for(const c of CHESTS)if(!S.opened[c.id]&&vis(c))spr.push({y:c.y,e:'📦',x:c.x,glow:1});
 for(const k of PICKS)if(!S.taken[k.id]&&pickVisible(k)&&vis(k))spr.push({y:k.y,e:k.e,x:k.x,glow:1,bob:1});
 for(const m of MONS){if(S.dead[m.i]!==undefined||!vis(m))continue;const b=ENEMY[m.id];spr.push({y:m.y,e:b.e,x:m.x,sz:m.boss===1?1.7:m.boss===2?1.25:1,lbl:m.boss?b.n:null,mon:1})}
 for(const n of NPCS)if(vis(n))spr.push({y:n.y,e:n.e,x:n.x,lbl:n.n,npc:1,mark:npcMark(n)});
 spr.push({y:P.y,e:CLASSES[S.cls].e,x:P.x,me:1});
 spr.sort((a,b)=>a.y-b.y);
 for(const s of spr){const px=ox+s.x*TS,py=oy+s.y*TS;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(px,py+TS*.28,TS*.3*(s.sz||1),TS*.11,0,0,7);ctx.fill();

  if(s.lbl){ctx.font='bold '+Math.floor(TS*.3)+'px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.fillStyle=s.mon?'#ff8a7a':'#fff0b8';const ly=py-TS*(.55*(s.sz||1)+.1);ctx.strokeText(s.lbl,px,ly);ctx.fillText(s.lbl,px,ly)}
  if(s.mark){ctx.font=Math.floor(TS*.5)+'px sans-serif';ctx.fillText(s.mark,px+TS*.35,py-TS*.7+Math.sin(tm*4)*2)}}
 // night
 const dk=darkness();
 if(dk>0){const g=ctx.createRadialGradient(VW/2+ (P.x-cx)*TS,VH/2+(P.y-cy)*TS,TS*2,VW/2+(P.x-cx)*TS,VH/2+(P.y-cy)*TS,TS*7);g.addColorStop(0,`rgba(8,12,50,${dk*.25})`);g.addColorStop(1,`rgba(6,8,40,${dk*.72})`);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH)}
 if(S.wx==='rain'){ctx.fillStyle='rgba(20,40,80,.18)';ctx.fillRect(0,0,VW,VH);ctx.strokeStyle='rgba(190,210,255,.5)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<90;i++){const x=(i*97+tm*180)%VW,y=(i*53+tm*620)%VH;ctx.moveTo(x,y);ctx.lineTo(x-4,y+14)}ctx.stroke()}
