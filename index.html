<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<title>سيف الرمال | لعبة أدوار عربية</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#120d09;color:#f5e6c8;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;overflow:hidden;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5}
.bars{flex:1;max-width:260px;background:#000a;border:1px solid #c9a35a66;border-radius:10px;padding:5px 8px;font-size:12px}
.bar{height:9px;background:#0008;border-radius:5px;margin:3px 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;transition:width .2s}
.hp i{background:linear-gradient(#ff6b5a,#c02a1e)}.mp i{background:linear-gradient(#6db3ff,#2a62c0)}.xp i{background:linear-gradient(#ffe27a,#c9962a)}
.row{display:flex;justify-content:space-between;gap:6px}
#info{background:#000a;border:1px solid #c9a35a66;border-radius:10px;padding:5px 9px;font-size:12px;text-align:center;min-width:92px}
#comp{position:fixed;top:calc(max(6px,env(safe-area-inset-top)) + 78px);left:6px;background:#000a;border:1px solid #c9a35a66;border-radius:10px;padding:4px 8px;font-size:12px;z-index:5;pointer-events:none;max-width:200px;display:flex;gap:6px;align-items:center}
#arrow{display:inline-block;font-size:18px;transition:transform .15s;color:#ffd24a}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#000c;border:1px solid #ffd24a88;border-radius:12px;padding:8px 14px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#btns{direction:ltr;position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:6}
#btns .sm{display:flex;gap:6px;position:fixed;right:10px;bottom:calc(170px + env(safe-area-inset-bottom));direction:ltr}
button,.btn{font:inherit;color:#fff3d6;background:linear-gradient(#6b4a22,#4a2f12);border:1px solid #e0b866;border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.45}
#act{width:84px;height:84px;border-radius:50%;font-size:15px;background:radial-gradient(#d9a441,#8a5a14);box-shadow:0 0 0 0 #ffd24a;font-weight:700}
#act.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffd24acc}100%{box-shadow:0 0 0 18px #ffd24a00}}
#dpad{direction:ltr;position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template:repeat(3,46px)/repeat(3,46px);gap:4px;z-index:7;touch-action:none}#dpad b{display:flex;align-items:center;justify-content:center;background:#3a240dcc;border:2px solid #e0b866;border-radius:14px;color:#fff3d6;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:none}#dpad b.p{background:#d9a441cc}#joyzone{position:fixed;left:0;bottom:0;width:48%;height:46%;z-index:4}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff44;background:#ffffff14;display:none;z-index:4;pointer-events:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:#ffffff66;left:34px;top:34px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20;padding:10px}
#panel{background:linear-gradient(#2a1d12,#1b1410);border:2px solid #c9a35a;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:14px;box-shadow:0 10px 40px #000}
#panel h2{margin:0 0 8px;font-size:19px;color:#ffd98a}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}.who .em{border-radius:12px;background:#0006}.who b{font-size:17px;color:#ffd98a}.who small{display:block;opacity:.7}
.say{background:#0006;border-radius:10px;padding:10px;line-height:1.7;font-size:15px;margin-bottom:10px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.item{background:#0006;border:1px solid #7a5a2a;border-radius:10px;padding:7px;font-size:13px}
.item b{display:block}.item .d{opacity:.75;font-size:12px;margin:2px 0 5px}
.item button{padding:5px 9px;font-size:12px;margin:2px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs button.sel{background:linear-gradient(#d9a441,#8a5a14)}
.q{background:#0006;border-radius:10px;padding:8px;margin-bottom:7px;font-size:13px;line-height:1.6}.q b{color:#ffd98a}.q.done{opacity:.55}
.hpbar{height:14px;background:#000a;border-radius:7px;overflow:hidden;margin:3px 0;border:1px solid #fff2}.hpbar i{display:block;height:100%}
#bt{display:flex;justify-content:space-around;align-items:flex-end;margin:8px 0;min-height:120px}
.fighter{text-align:center;width:46%}.fighter b{display:block}.fighter .em{width:104px;height:104px;transition:transform .15s}.fighter.hit .em{transform:translateX(10px) scale(.9);filter:brightness(2)}
#log{background:#0006;border-radius:10px;padding:8px;height:92px;overflow:auto;font-size:13px;line-height:1.6;margin-bottom:8px}
#log div:last-child{color:#ffe08a}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cols button{padding:11px 6px}
.title{text-align:center}
.title h1{font-size:34px;margin:6px 0;color:#ffd98a;text-shadow:0 0 18px #d9a44188}
.title p{opacity:.85;line-height:1.7;font-size:14px}
input{font:inherit;background:#0008;color:#fff;border:1px solid #c9a35a;border-radius:8px;padding:9px;width:100%;margin:6px 0;text-align:center;font-size:16px}
.cls{display:flex;gap:7px}.cls button{flex:1;padding:10px 4px;font-size:13px}.cls button.sel{background:linear-gradient(#d9a441,#8a5a14)}
#mapc{width:100%;image-rendering:pixelated;border-radius:8px;border:1px solid #7a5a2a;background:#000}
.small{font-size:12px;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="bars"><div class="row"><b id="nm">-</b><span id="lv">-</span></div>
  <div class="bar hp"><i id="hpb"></i></div><div class="bar mp"><i id="mpb"></i></div><div class="bar xp"><i id="xpb"></i></div>
  <div class="row"><span id="hpt"></span><span id="gold"></span></div></div>
 <div id="info"><div id="clock">-</div><div id="wx" class="small">-</div><div id="zone" class="small">-</div></div>
</div>
<div id="comp"><span id="arrow">➤</span><span id="ctext">-</span></div>
<div id="toast"></div>
<div id="dpad"><b data-d="U" style="grid-area:1/2">▲</b><b data-d="L" style="grid-area:2/1">◀</b><b data-d="R" style="grid-area:2/3">▶</b><b data-d="D" style="grid-area:3/2">▼</b></div><div id="joyzone"></div><div id="joy"><div id="knob"></div></div>
<div id="btns">
 <div class="sm"><button id="bSnd">🔊</button><button id="bSk">⭐ مهارات</button><button id="bMap">🗺️ خريطة</button><button id="bQ">📜 مهام</button><button id="bInv">🎒 حقيبة</button></div>
 <button id="act">تفاعل</button>
</div>
<div id="modal"><div id="panel"></div></div>
<script>
// ===== procedural vector art (no emoji dependence for world sprites) =====
const LOOK={
 warrior:{skin:'#e0ac80',body:'#8a929c',pants:'#4a4038',hat:'helmet',hatc:'#aab2bc',cape:'#b02a2a',wp:'sword'},
 archer:{skin:'#e0ac80',body:'#3f7a3a',pants:'#4a3a28',hat:'hood',hatc:'#2f6a2f',wp:'bow'},
 mage:{skin:'#e0ac80',body:'#3a4ea8',pants:'#2a2a60',hat:'wizard',hatc:'#2c3a8a',wp:'staff'},
 elder:{skin:'#d9a67a',body:'#e8e0cc',pants:'#cfc5aa',hat:'turban',hatc:'#fff',beard:'#ddd'},
 hasan:{skin:'#c9916a',body:'#b8742a',pants:'#5a3a1a',hat:'cap',hatc:'#7a3a1a',stache:1},
 umyusuf:{skin:'#d9a67a',body:'#7a3a7a',pants:'#5a2a5a',hat:'scarf',hatc:'#c25a9a'},
 rami:{skin:'#e0ac80',body:'#4aa0d0',pants:'#3a5a7a',hat:'hair',hatc:'#2a1a10',small:1},
 awad:{skin:'#b9825a',body:'#8a7a4a',pants:'#5a4a2a',hat:'straw',hatc:'#d9c27a',stache:1},
 nabil:{skin:'#c9916a',body:'#1f3a6a',pants:'#1a2a4a',hat:'captain',hatc:'#f0f0f0',beard:'#555'},
 layla:{skin:'#e0ac80',body:'#d95a6a',pants:'#8a3a4a',hat:'longhair',hatc:'#8a3a1a'},
 shawqi:{skin:'#c9916a',body:'#4a8a8a',pants:'#3a5a5a',hat:'cap',hatc:'#e0c050',wp:'rod'},
 hashem:{skin:'#c9916a',body:'#5a6a3a',pants:'#3a4a2a',hat:'helmet',hatc:'#7a8a5a',beard:'#333',cape:'#2a4a8a'},
 gamal:{skin:'#b9825a',body:'#6a4a3a',pants:'#3a2a20',hat:'bald',hatc:'#000',stache:1,apron:1},
 reem:{skin:'#e0ac80',body:'#6a8a3a',pants:'#4a3a28',hat:'hood',hatc:'#4a6a2a',wp:'bow'},
 farida:{skin:'#e0ac80',body:'#e0d4b0',pants:'#8a7a5a',hat:'safari',hatc:'#c9a860'},
 hermit:{skin:'#d9a67a',body:'#8a5a3a',pants:'#6a4a2a',hat:'hood',hatc:'#7a5a3a',beard:'#eee',wp:'staff'},
 sailor:{skin:'#c9916a',body:'#e8e8f0',pants:'#2a3a6a',hat:'cap',hatc:'#2a3a6a',stripes:1}
};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function person(c,x,y,S,L,t,mv){
 const u=S/40*(L.small?.8:1),sw=mv?Math.sin(t*14)*3*u:0,bob=mv?Math.abs(Math.sin(t*14))*-1.5*u:Math.sin(t*2)*.4*u;
 c.save();c.translate(x,y+bob);
 if(L.cape){c.fillStyle=L.cape;c.beginPath();c.moveTo(-8*u,-26*u);c.lineTo(8*u,-26*u);c.lineTo(11*u+sw*.3,-4*u);c.lineTo(-11*u+sw*.3,-4*u);c.fill()}
 c.fillStyle=L.pants;rr(c,-6*u+sw,-12*u,5*u,12*u,2*u);c.fill();rr(c,1*u-sw,-12*u,5*u,12*u,2*u);c.fill();
 c.fillStyle='#2a1a10';c.fillRect(-6.5*u+sw,-2*u,6*u,2.5*u);c.fillRect(.5*u-sw,-2*u,6*u,2.5*u);
 c.fillStyle=L.body;rr(c,-8*u,-27*u,16*u,17*u,4*u);c.fill();
 if(L.stripes){c.fillStyle='#2a3a6a';for(let i=0;i<3;i++)c.fillRect(-8*u,(-24+i*5)*u,16*u,1.6*u)}
 if(L.apron){c.fillStyle='#3a3a3a';c.fillRect(-5*u,-22*u,10*u,12*u)}
 c.fillStyle=L.skin;rr(c,-11*u,-25*u,4*u,10*u,2*u);c.fill();rr(c,7*u,-25*u,4*u,10*u,2*u);c.fill();
 if(L.wp==='sword'){c.fillStyle='#d8dde4';c.fillRect(10*u,-34*u,2.4*u,16*u);c.fillStyle='#8a5a2a';c.fillRect(8*u,-19*u,6*u,2*u)}
 if(L.wp==='staff'){c.fillStyle='#7a5a2a';c.fillRect(10*u,-38*u,2.4*u,36*u);circ(c,11.2*u,-39*u,4*u,'#7fd8ff')}
 if(L.wp==='bow'){c.strokeStyle='#7a5a2a';c.lineWidth=2*u;c.beginPath();c.arc(11*u,-20*u,11*u,-1.2,1.2);c.stroke();c.strokeStyle='#eee';c.lineWidth=.8*u;c.beginPath();c.moveTo(11*u+11*u*Math.cos(-1.2),-20*u+11*u*Math.sin(-1.2));c.lineTo(11*u+11*u*Math.cos(1.2),-20*u+11*u*Math.sin(1.2));c.stroke()}
 if(L.wp==='rod'){c.strokeStyle='#7a5a2a';c.lineWidth=1.6*u;c.beginPath();c.moveTo(10*u,-22*u);c.lineTo(20*u,-40*u);c.stroke()}
 circ(c,0,-32*u,8*u,L.skin);
 if(L.beard){c.fillStyle=L.beard;c.beginPath();c.arc(0,-30*u,7.6*u,.15,Math.PI-.15);c.fill()}
 if(L.stache){c.fillStyle='#2a1a10';c.fillRect(-4*u,-30*u,8*u,2*u)}
 const h=L.hat,hc=L.hatc;c.fillStyle=hc;
 if(h==='helmet'){c.beginPath();c.arc(0,-33*u,8.6*u,Math.PI,0);c.fill();c.fillRect(-8.6*u,-34*u,17.2*u,3*u);c.fillStyle='#c33';c.fillRect(-1*u,-43*u,2*u,6*u)}
 else if(h==='hood'){c.beginPath();c.arc(0,-33*u,9*u,Math.PI*.95,Math.PI*.05+Math.PI*2);c.fill();c.fillRect(-9*u,-33*u,3*u,8*u);c.fillRect(6*u,-33*u,3*u,8*u)}
 else if(h==='wizard'){c.beginPath();c.moveTo(-10*u,-36*u);c.lineTo(0,-54*u);c.lineTo(10*u,-36*u);c.closePath();c.fill();c.fillRect(-11*u,-38*u,22*u,3*u);circ(c,0,-40*u,1.4*u,'#ffd24a')}
 else if(h==='turban'){c.beginPath();c.ellipse(0,-37*u,9.5*u,6.5*u,0,0,7);c.fill();c.fillStyle='#d8d0b8';c.fillRect(-9*u,-36*u,18*u,1.5*u)}
 else if(h==='cap'){c.beginPath();c.arc(0,-34*u,8.4*u,Math.PI,0);c.fill();c.fillRect(-9*u,-35*u,13*u,2.5*u)}
 else if(h==='scarf'){c.beginPath();c.arc(0,-33*u,8.8*u,Math.PI,0);c.fill();c.fillRect(-8.8*u,-34*u,3*u,10*u)}
 else if(h==='hair'){c.beginPath();c.arc(0,-34*u,8.2*u,Math.PI,0);c.fill()}
 else if(h==='longhair'){c.beginPath();c.arc(0,-33*u,8.8*u,Math.PI,0);c.fill();c.fillRect(-8.8*u,-33*u,3*u,12*u);c.fillRect(5.8*u,-33*u,3*u,12*u)}
 else if(h==='straw'){c.beginPath();c.ellipse(0,-37*u,13*u,3.5*u,0,0,7);c.fill();c.beginPath();c.arc(0,-37*u,6.5*u,Math.PI,0);c.fill()}
 else if(h==='captain'){c.beginPath();c.arc(0,-35*u,8.6*u,Math.PI,0);c.fill();c.fillStyle='#1f3a6a';c.fillRect(-9*u,-36*u,18*u,3*u);circ(c,0,-37*u,1.6*u,'#e0b030')}
 else if(h==='safari'){c.beginPath();c.ellipse(0,-37*u,12*u,3*u,0,0,7);c.fill();c.beginPath();c.arc(0,-37*u,7*u,Math.PI,0);c.fill()}
 c.fillStyle='#1a1008';c.fillRect(-3.6*u,-32*u,2*u,2.4*u);c.fillRect(1.6*u,-32*u,2*u,2.4*u);
 c.restore()}
function monster(c,x,y,S,id,t,mv){
 const u=S/40,w=Math.sin(t*(mv?12:3));c.save();c.translate(x,y);
 const eye=(a,b,r=2)=>{circ(c,a*u,b*u,r*u,'#fff');circ(c,a*u,b*u,r*.5*u,'#000')};
 switch(id){
 case'scorpion':c.strokeStyle='#8a1a10';c.lineWidth=3*u;c.beginPath();c.moveTo(8*u,-8*u);c.bezierCurveTo(22*u,-10*u,22*u,-30*u,10*u,-30*u);c.stroke();circ(c,9*u,-30*u,2.6*u,'#ff4030');
  c.fillStyle='#c62a1a';c.beginPath();c.ellipse(0,-9*u,12*u,8*u,0,0,7);c.fill();c.fillStyle='#a02014';c.beginPath();c.ellipse(-10*u,-10*u,6*u,5*u,0,0,7);c.fill();
  for(const s of[-1,1]){c.fillStyle='#d83a24';c.beginPath();c.ellipse(-16*u,(-10+s*7)*u,5*u,3*u,s*.4,0,7);c.fill()}eye(-13,-13,1.6);eye(-13,-8,1.6);
  c.strokeStyle='#8a1a10';c.lineWidth=1.6*u;for(let i=0;i<3;i++){c.beginPath();c.moveTo((-4+i*5)*u,-4*u);c.lineTo((-6+i*5)*u,w*1.5*u);c.stroke()}break;
 case'snake':c.strokeStyle='#3a8a3a';c.lineWidth=7*u;c.lineCap='round';c.beginPath();c.moveTo(-14*u,-4*u);c.bezierCurveTo(-6*u,-18*u+w*3*u,2*u,6*u,10*u,-8*u);c.lineTo(12*u,-16*u);c.stroke();c.strokeStyle='#7acb5a';c.lineWidth=2*u;c.setLineDash([3*u,5*u]);c.stroke();c.setLineDash([]);circ(c,12*u,-17*u,5*u,'#3a8a3a');eye(14,-19,1.4);c.strokeStyle='#e22';c.lineWidth=1.2*u;c.beginPath();c.moveTo(17*u,-17*u);c.lineTo(22*u,-17*u);c.stroke();break;
 case'wolf':case'elite':case'boar':{const col=id==='wolf'?'#7a7e86':id==='boar'?'#6a4a3a':'#e0902a',bs=id==='elite'?1.3:1;c.scale(bs,bs);
  c.fillStyle=col;for(const lx of[-10,-4,6,12]){c.fillRect((lx+w*(lx>0?1:-1))*u,-9*u,3.6*u,9*u)}
  c.beginPath();c.ellipse(0,-14*u,15*u,8*u,0,0,7);c.fill();c.beginPath();c.ellipse(14*u,-18*u,7*u,6*u,0,0,7);c.fill();
  c.beginPath();c.moveTo(11*u,-23*u);c.lineTo(13*u,-30*u);c.lineTo(16*u,-23*u);c.fill();c.fillStyle=id==='boar'?'#e8e0c0':col;c.fillRect(18*u,-18*u,6*u,4*u);
  if(id==='elite'){c.fillStyle='#222';for(let i=-2;i<3;i++)c.fillRect((i*5)*u,-21*u,2*u,9*u)}
  c.strokeStyle=col;c.lineWidth=3*u;c.beginPath();c.moveTo(-14*u,-16*u);c.quadraticCurveTo(-24*u,-20*u,-22*u,-28*u+w*3*u);c.stroke();eye(16,-20,1.6);if(id==='boar'){c.fillStyle='#fff';c.fillRect(21*u,-15*u,2*u,5*u)}break}
 case'bandit':case'chief':{const big=id==='chief';c.scale(big?1.25:1,big?1.25:1);person(c,0,0,S,{skin:'#c9916a',body:big?'#5a1a1a':'#3a3a42',pants:'#2a2a2a',hat:'scarf',hatc:big?'#8a1a1a':'#1a1a1a',wp:'sword',stache:big},t,mv);c.fillStyle='#111';c.fillRect(-7*u,-31*u,14*u,4*u);c.fillStyle='#fc4';c.fillRect(-4*u,-30*u,2*u,1.4*u);c.fillRect(2*u,-30*u,2*u,1.4*u);break}
 case'spider':c.strokeStyle='#2a1a2a';c.lineWidth=2*u;for(let i=0;i<4;i++)for(const s of[-1,1]){c.beginPath();c.moveTo(0,-12*u);c.lineTo(s*(10+i*3)*u,(-22+i*5+(w*(i%2?1:-1)))*u);c.lineTo(s*(14+i*3)*u,-2*u);c.stroke()}

function genDungeon(f){
 const rg=mulberry(SEED*7+f*131),rn=(a,b)=>a+Math.floor(rg()*(b-a+1));
 tile.fill(T.DWALL);deco.fill('');for(let i=0;i<W*H;i++)vari[i]=hash2(i%W,(i/W)|0,40+f);
 const rooms=[];
 for(let k=0;k<220&&rooms.length<11;k++){const w=rn(6,11),h=rn(6,10),x=rn(4,W-w-5),y=rn(4,H-h-5);
  if(rooms.some(r=>x<r.x+r.w+3&&x+w+3>r.x&&y<r.y+r.h+3&&y+h+3>r.y))continue;rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)})}
 rooms.sort((a,b)=>a.cx-b.cx);
 const carve=(x,y)=>{if(inb(x,y)&&x>2&&y>2&&x<W-3&&y<H-3)tile[idx(x,y)]=T.DFLOOR};
 for(const r of rooms)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)carve(x,y);
 for(let i=1;i<rooms.length;i++){const a=rooms[i-1],b=rooms[i];let x=a.cx,y=a.cy;
  while(x!==b.cx){carve(x,y);carve(x,y+1);x+=Math.sign(b.cx-x)}while(y!==b.cy){carve(x,y);carve(x+1,y);y+=Math.sign(b.cy-y)}}
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y);
  if(tile[i]===T.DWALL&&tile[idx(x,y+1)]===T.DFLOOR&&hash2(x,y,90+f)<.09)deco[i]='🕯️';
  else if(tile[i]===T.DFLOOR){const h=hash2(x,y,70+f);if(h<.012)deco[i]='🦴';else if(h<.022)deco[i]='🏺'}}
 const first=rooms[0],last=rooms[rooms.length-1];
 for(const r of[first,last])for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)deco[idx(x,y)]='';
 PORTALS.length=0;MONS.length=0;CHESTS.length=0;PICKS.length=0;
 PORTALS.push({x:first.cx+.5,y:first.cy+.5,kind:'up'});
 if(f<3)PORTALS.push({x:last.cx+.5,y:last.cy+.5,kind:'down'});
 let n=0;const en=DUN_EN[f],lv=DUN_LVL[f];
 rooms.forEach((r,ri)=>{if(ri===0)return;
  const cnt=ri===rooms.length-1?0:rn(2,4);
  for(let k=0;k<cnt;k++){const x=rn(r.x+1,r.x+r.w-2),y=rn(r.y+1,r.y+r.h-2);const id=en[rn(0,en.length-1)];
   MONS.push({i:'d'+f+'_'+n,id,lvl:lv+rn(0,2),x:x+.5,y:y+.5,hx:x+.5,hy:y+.5,t:rg()*5,vx:0,vy:0,boss:0});n++}
  if(ri!==rooms.length-1&&rg()<.55){const x=rn(r.x+1,r.x+r.w-2),y=rn(r.y+1,r.y+r.h-2);CHESTS.push({id:'dc'+f+'_'+ri,x:x+.5,y:y+.5,tier:3+f})}});
 const bid='d'+f+'_boss';
 MONS.push({i:bid,id:DUN_BOSS[f],lvl:[0,8,11,14][f],x:last.cx+.5,y:last.cy-1.5,hx:last.cx+.5,hy:last.cy-1.5,t:0,vx:0,vy:0,boss:1});
 CHESTS.push({id:'dcb'+f,x:last.cx+2.5,y:last.cy+1.5,tier:5+f,need:bid});
 if(f===3){PICKS.push({id:'relic_w6',x:last.cx-2.5,y:last.cy+1.5,item:'w6',e:'👑',need:bid});PICKS.push({id:'relic_a6',x:last.cx-3.5,y:last.cy+1.5,item:'a6',e:'🛡️',need:bid})}
 return{first,last}}
function enterLayer(f,from){ // from: 'down' (came from above), 'up' (came from below), 'in' (from world)
 if(!S.dun){WORLD={tile:tile.slice(),deco:deco.slice(),vari:vari.slice(),M:MONS.splice(0),P:PICKS.splice(0),C:CHESTS.splice(0),N:NPCS.splice(0),B:BOARDS.splice(0),O:PORTALS.splice(0)};S.wpos=[P.x,P.y]}
 S.dun=f;const g=genDungeon(f);
 if(from==='up'){P.x=g.last.cx+.5;P.y=g.last.cy+1.7}else{P.x=g.first.cx+.5;P.y=g.first.cy+1.7}
 graceUntil=performance.now()+1500;save()}
function exitLayer(){if(!WORLD)return;tile.set(WORLD.tile);deco.splice(0,deco.length,...WORLD.deco);vari.set(WORLD.vari);
 MONS.length=0;CHESTS.length=0;PICKS.length=0;NPCS.length=0;BOARDS.length=0;PORTALS.length=0;
 MONS.push(...WORLD.M);PICKS.push(...WORLD.P);CHESTS.push(...WORLD.C);NPCS.push(...WORLD.N);BOARDS.push(...WORLD.B);PORTALS.push(...WORLD.O);
 S.dun=0;WORLD=null;graceUntil=performance.now()+1500}

function portalArt(c,x,y,S,kind,t){const u=S/40;c.save();c.translate(x,y);

 else{c.fillStyle='#2a2030';c.fillRect(-18*u,-4*u,36*u,6*u);const dn=kind==='down';for(let i=0;i<4;i++){c.fillStyle=dn?'rgba(0,0,0,'+(.3+i*.2)+')':'rgba(200,190,230,'+(.8-i*.15)+')';c.fillRect((-16+i*2)*u,(-4-i*5)*u*(dn?-.6:1),(32-i*4)*u,5*u)}
  c.fillStyle=dn?'#ff9a4a':'#7fe0ff';c.font='bold '+Math.floor(14*u)+'px sans-serif';c.textAlign='center';c.fillText(dn?'▼':'▲',0,-26*u+Math.sin(t*4)*2)}

function dunDeco(c,d,px,py,TS,t){const u=TS/40,cx=px+TS/2,by=py+TS*.92;
 if(d==='🕯️'){c.fillStyle='#3a2a1a';c.fillRect(cx-1.5*u,py+TS*.3,3*u,TS*.4);const fl=1+Math.sin(t*9+px)*.15;c.fillStyle='#ffb030';c.beginPath();c.ellipse(cx,py+TS*.25,4*u*fl,7*u*fl,0,0,7);c.fill();c.fillStyle='#fff2a0';c.beginPath();c.ellipse(cx,py+TS*.28,2*u,4*u,0,0,7);c.fill();c.fillStyle='rgba(255,170,50,.12)';c.beginPath();c.arc(cx,py+TS*.3,TS*1.2,0,7);c.fill()}
 else if(d==='🦴'){c.strokeStyle='#d8d2bc';c.lineWidth=3*u;c.lineCap='round';c.beginPath();c.moveTo(cx-8*u,by-6*u);c.lineTo(cx+8*u,by-3*u);c.moveTo(cx-5*u,by-2*u);c.lineTo(cx+6*u,by-9*u);c.stroke();c.fillStyle='#e8e4d0';c.beginPath();c.arc(cx-9*u,by-14*u,5*u,0,7);c.fill();c.fillStyle='#222';c.fillRect(cx-11*u,by-15*u,2*u,2*u);c.fillRect(cx-7*u,by-15*u,2*u,2*u)}

let B=null,graceUntil=0;
function startBattle(mon){
 const en=mkEnemy(mon.id,mon.lvl);if(mon.boss===2){en.hp=Math.round(en.hp*1.2)}
 B={mon,en,max:en.hp,log:[`⚔️ ظهر ${en.n} (مستوى ${en.lvl})!`],buff:{atk:0,guard:0,dodge:0},poison:0,turn:0,def:false,busy:false,over:false};
 MODAL='battle';beep(220,.2,'sawtooth');renderBattle()}
function renderBattle(hitE,hitP){
 const s=stats(),c=CLASSES[S.cls],en=B.en;
 const sk=c.sk.filter(k=>k.lv<=S.lvl).map((k,i)=>`<button ${S.mp<k.mp||B.busy?'disabled':''} onclick="bAct('sk',${c.sk.indexOf(k)})">✨ ${k.n} (${k.mp})</button>`).join('');
 const pots=['p1','p2','p3','m1'].filter(id=>inv(id)).map(id=>`<button ${B.busy?'disabled':''} onclick="bAct('item','${id}')">${item(id).e} ${item(id).n.replace('مشروب ','')} ×${inv(id)}</button>`).join('');
 openModal(`<div id="bt"><div class="fighter ${hitP?'hit':''}"><img class="em" src="${spriteURL('p',S.cls,128)}"><b>${esc(S.name)}</b> <span class="small">م${S.lvl}</span><div class="hpbar"><i style="width:${Math.max(0,S.hp/s.maxHp*100)}%;background:#d9433a"></i></div><div class="hpbar" style="height:8px"><i style="width:${S.mp/s.maxMp*100}%;background:#3a7bd9"></i></div><span class="small">${S.hp}/${s.maxHp} · طاقة ${S.mp}</span></div>
 <div class="fighter ${hitE?'hit':''}"><img class="em" src="${spriteURL('mon',en.id,128)}"><b>${en.n}</b> <span class="small">م${en.lvl}</span><div class="hpbar"><i style="width:${Math.max(0,en.hp/B.max*100)}%;background:#c9a02a"></i></div><span class="small">${Math.max(0,en.hp)}/${B.max}${B.poison?' ☠️':''}${B.stun?' 💫':''}</span></div></div>
 <div id="log">${B.log.slice(-6).map(l=>'<div>'+esc(l)+'</div>').join('')}</div>
 <div class="cols"><button ${B.busy?'disabled':''} onclick="bAct('atk')">⚔️ هجوم</button><button ${B.busy?'disabled':''} onclick="bAct('def')">🛡️ دفاع</button>${sk}<button ${B.busy||en.boss?'disabled':''} onclick="bAct('flee')">🏃 هرب</button></div>${pots?'<div class="cols" style="margin-top:7px">'+pots+'</div>':''}`);
 const l=$('log');if(l)l.scrollTop=1e5}
function eDmg(){const s=stats(),en=B.en;let d=en.atk*(.85+R()*.3);
 if(en.boss&&B.turn%3===2){d*=1.8;B.log.push(`⚠️ ${en.n} يستعد لضربة قوية!`)}
 d-=s.def*.6;if(B.def)d*=.5;if(B.buff.guard>0)d*=.6;return Math.max(1,Math.round(d))}
async function bAct(a,arg){
 if(!B||B.busy||B.over)return;B.busy=true;const s=stats(),c=CLASSES[S.cls],en=B.en;let acted=true,hitE=false;B.def=false;
 const crit=()=>R()<(S.cls==='archer'?.25:.1)+(S.sk.crit||0)*.03;
 const dmgTo=(mult,ignore)=>{let d=(s.atk*(.85+R()*.3))*mult*(B.buff.atk>0?1.4:1)*(mult>1?1+(S.sk.pow||0)*.06:1);if(!ignore)d-=en.def*.6;d=Math.max(1,Math.round(d));if(crit()){d=Math.round(d*1.7);B.log.push('💥 ضربة حرجة!')}en.hp-=d;hitE=true;return d};
 if(a==='atk'){const d=dmgTo(1);B.log.push(`⚔️ ضربت ${en.n} بـ ${d}`);beep(300,.07,'square')}
 else if(a==='def'){B.def=true;B.log.push('🛡️ اتخذت وضع الدفاع.');S.mp=Math.min(stats().maxMp,S.mp+3)}
 else if(a==='flee'){if(R()<.55){B.log.push('🏃 هربت بنجاح!');endBattle('flee');return}B.log.push('❌ فشل الهروب!')}
 else if(a==='item'){const it=item(arg);if(it.heal)S.hp=Math.min(s.maxHp,S.hp+it.heal);if(it.mana)S.mp=Math.min(s.maxMp,S.mp+it.mana);give(arg,-1);B.log.push(`${it.e} استخدمت ${it.n}.`);beep(700,.1,'triangle')}
 else if(a==='sk'){const k=c.sk[arg];S.mp-=k.mp;
  if(k.k==='dmg'||k.k==='magic'){const d=dmgTo(k.m,k.k==='magic');B.log.push(`✨ ${k.n}! ${d} ضرر`)}
  else if(k.k==='poison'){const d=dmgTo(k.m);B.poison=4;B.log.push(`☠️ ${k.n}! ${d} ضرر + سم`)}
  else if(k.k==='heal'){const h=Math.round(s.maxHp*.35);S.hp=Math.min(s.maxHp,S.hp+h);B.log.push(`💚 شفاء ${h}`)}

   ctx.save();ctx.translate(px,py+TS*.3);if(s.me){const f=P.face<0;if(f)ctx.scale(-1,1);person(ctx,0,0,TS,LOOK[S.cls],tm,P.moving)}
   else if(s.art==='npc')person(ctx,0,0,TS,LOOK[s.id],tm+s.x,0);
   else monster(ctx,0,0,TS*(ENEMY[s.id].boss===1?1.4:s.id==='elite'?1:1),s.id,tm+(s.ph||0),s.mv);
   ctx.restore()}
  if(s.lbl){ctx.font='bold '+Math.floor(TS*.3)+'px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.fillStyle=s.mon?'#ff8a7a':'#fff0b8';const ly=py-TS*(s.mon&&ENEMY[s.id].boss===1?1.5:.95);ctx.strokeText(s.lbl,px,ly);ctx.fillText(s.lbl,px,ly)}
  if(s.mark){ctx.font='bold '+Math.floor(TS*.6)+'px sans-serif';ctx.fillStyle=s.mark==='❗'?'#ffd24a':'#7fff9a';ctx.strokeStyle='#000';ctx.lineWidth=3;const my=py-TS*1.2+Math.sin(tm*4)*2;const mt=s.mark==='❗'?'!':'?';ctx.strokeText(mt,px,my);ctx.fillText(mt,px,my)}}
 // night
 const dk=S.dun?.8:darkness();
 if(dk>0){const g=ctx.createRadialGradient(VW/2+ (P.x-cx)*TS,VH/2+(P.y-cy)*TS,TS*2,VW/2+(P.x-cx)*TS,VH/2+(P.y-cy)*TS,TS*7);g.addColorStop(0,`rgba(8,12,50,${dk*.25})`);g.addColorStop(1,`rgba(6,8,40,${dk*.72})`);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH)}
 if(S.wx==='rain'&&!S.dun){ctx.fillStyle='rgba(20,40,80,.18)';ctx.fillRect(0,0,VW,VH);ctx.strokeStyle='rgba(190,210,255,.5)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<90;i++){const x=(i*97+tm*180)%VW,y=(i*53+tm*620)%VH;ctx.moveTo(x,y);ctx.lineTo(x-4,y+14)}ctx.stroke()}
 if(S.wx==='sand'&&!S.dun){ctx.fillStyle='rgba(210,160,70,.28)';ctx.fillRect(0,0,VW,VH);ctx.fillStyle='rgba(240,200,120,.6)';for(let i=0;i<70;i++){const x=(i*113+tm*420)%VW,y=(i*71+Math.sin(tm+i)*30)%VH;ctx.fillRect(x,y,10,1.5)}}
}
function npcMark(n){for(const q of QUESTS){if(q.turn===n.id){const st=questStatus(q);if(st==='ready'||(st==='active'&&q.obj.t==='talk'))return'❓'}}
 for(const q of QUESTS){if(q.giver===n.id&&questStatus(q)==='new'&&(!q.pre||(S.q[q.pre]&&S.q[q.pre].s==='done')))return'❗'}return''}
let last=0;
function frame(t){const dt=Math.min(.06,(t-last)/1000||0);last=t;try{update(dt);draw(t)}catch(e){console.error(e);window.__err=String(e&&e.stack||e)}requestAnimationFrame(frame)}
// ===== title / start =====
function hasSave(){try{return!!localStorage.getItem(SAVEKEY)}catch(e){return false}}
let pickCls='warrior';
function titleUI(){
 MODAL='title';
 openModal(`<div class="title"><h1>🏜️ سيف الرمال</h1><p>لعبة أدوار عربية مفتوحة العالم. استكشف الصحراء، كلّم الناس، خد المهام، قاتل الوحوش، وحرر الواحة من الوزير الأسود.</p><div class="opts">${hasSave()?'<button onclick="loadGame()">▶️ متابعة اللعب</button>':''}<button onclick="newGameUI()">✨ لعبة جديدة</button></div><p class="small">تتحرك بالعصا في الشمال (أو WASD)، وزر التفاعل للتحدث وفتح الصناديق. الحفظ تلقائي.</p></div>`)}
function newGameUI(){
 const c=CLASSES;
 openModal(`<div class="title"><h2>اسم البطل</h2><input id="pname" maxlength="14" value="${esc(S&&S.name||'')}" placeholder="اكتب اسمك"><h2>اختر فئتك</h2><div class="cls">${Object.keys(c).map(k=>`<button id="cl_${k}" class="${k===pickCls?'sel':''}" onclick="pickClass('${k}')">${c[k].e}<br>${c[k].n}<br><span class="small">${c[k].d}</span></button>`).join('')}</div><div class="opts" style="margin-top:12px"><button onclick="startNew()">🚀 ابدأ الرحلة</button></div></div>`)}
function pickClass(k){pickCls=k;document.querySelectorAll('.cls button').forEach(b=>b.classList.toggle('sel',b.id==='cl_'+k))}
function startNew(){const nm=($('pname').value||'').trim()||'بطل';S=newState(nm,pickCls);startMusic();const s=stats();S.hp=s.maxHp;S.mp=s.maxMp;P.x=48.5;P.y=51.5;MODAL=null;
 openModal(`<div class="title"><h2>📖 البداية</h2><p style="text-align:right;font-size:15px;line-height:1.9">منذ مئات السنين، حمت «نجمة الصحراء» عين الماء في واحة النخيل. وفي ليلة بلا قمر، سُرقت النجمة وتكسرت، وبدأت العين تجف.<br><br>أنت ${esc(nm)}، غريب وصل الواحة جريح ومنهك. الشيخ سالم أنقذك، والآن أنت أمل أهل الواحة الأخير.<br><br>🎯 <b>اذهب وكلّم الشيخ سالم</b> (العلامة ❗ فوق رأسه). يقف شرق مركز الواحة.</p><div class="opts"><button onclick="closeModal();save()">يلا نبدأ</button></div></div>`);MODAL='intro';S.tracked=null}
function loadGame(){try{S=JSON.parse(localStorage.getItem(SAVEKEY));P.x=S.x;P.y=S.y;restoreBounties();if(S.dun){const f=S.dun,px=S.x,py=S.y;S.dun=0;P.x=S.wpos[0];P.y=S.wpos[1];enterLayer(f,'in');P.x=px;P.y=py}closeModal();startMusic();toast('أهلاً من تاني يا '+S.name)}catch(e){newGameUI()}}
function boot(){genWorld();buildEntities();for(const k of['village','port','fort']){const p=POI[k],pos=freeNear(p.x+3,p.y-2,4);BOARDS.push({n:p.n,x:pos.x,y:pos.y})}{const p=POI.cave,pos=freeNear(Math.round(p.x),Math.round(p.y+5),4);PORTALS.push({x:pos.x,y:pos.y,kind:'in'})}resize();requestAnimationFrame(frame);titleUI();window.__ready=1}
// ===== music =====
let MUTE=false;try{MUTE=localStorage.getItem('ss_mute')==='1'}catch(e){}
const HIJ=[0,1,4,5,7,8,11,12];let musicOn=false,mstep=0;
function setMute(m){MUTE=m;try{localStorage.setItem('ss_mute',m?'1':'0')}catch(e){}$('bSnd').textContent=m?'🔇':'🔊'}
function note(f,d,v,type){try{const A=beep.a||(beep.a=new(window.AudioContext||window.webkitAudioContext)());if(A.state==='suspended')A.resume();const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,A.currentTime);g.gain.linearRampToValueAtTime(v,A.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d+.05)}catch(e){}}
function startMusic(){if(musicOn)return;musicOn=true;setMute(MUTE);
 setInterval(()=>{if(MUTE||!S||B)return;const night=darkness()>.5,base=146.8*(night?.5:1);mstep++;
  if(mstep%8===0)note(base/2,3.2,.05,'sine');
  if(Math.random()<(night?.5:.7)){const deg=HIJ[Math.floor(Math.random()*HIJ.length)];note(base*Math.pow(2,deg/12)*(Math.random()<.3?2:1),1.2,.035,night?'sine':'triangle')}},420)}
boot();
window.addEventListener('beforeunload',save);
</script></body></html>
